name: "SpaceFox temporary paired schedule format diagnostic — remove after 2026-11-12 13:45 UTC"
"on":
  schedule:
    - cron: "15 13 12 11 *"
    - cron: "20 13 12 11 *"
  workflow_dispatch: {}
permissions: {}
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: "Log trusted event identity within the finite UTC window"
        shell: python
        env:
          CANARY_EVENT: "${{ github.event_name }}"
          CANARY_CRON: "${{ github.event.schedule }}"
          CANARY_RUN_ID: "${{ github.run_id }}"
          CANARY_RUN_ATTEMPT: "${{ github.run_attempt }}"
          CANARY_HEAD_SHA: "${{ github.sha }}"
          CANARY_REF: "${{ github.ref }}"
          CANARY_REPOSITORY: "${{ github.repository }}"
          CANARY_WORKFLOW_REF: "${{ github.workflow_ref }}"
          CANARY_FORMAT: "yaml"
        run: |
          from datetime import datetime, timezone
          import json
          import os

          # Temporary diagnostic only. Cron has no year; reject outside this UTC window.
          window_start = datetime.fromisoformat("2026-11-12T12:20:00+00:00")
          window_end = datetime.fromisoformat("2026-11-12T13:45:00+00:00")
          slots = {"15 13 12 11 *": "2026-11-12T13:15:00+00:00",
                   "20 13 12 11 *": "2026-11-12T13:20:00+00:00"}
          now = datetime.now(timezone.utc)
          event = os.environ["CANARY_EVENT"]
          cron = os.environ["CANARY_CRON"]
          ref = os.environ["CANARY_REF"]
          allowed = (window_start <= now < window_end and ref == "refs/heads/main" and
                     ((event == "workflow_dispatch" and cron == "") or
                      (event == "schedule" and cron in slots and
                       now >= datetime.fromisoformat(slots[cron]))))
          print(json.dumps({
              "diagnostic": "spacefox-schedule-format-pair-r2",
              "format": os.environ["CANARY_FORMAT"],
              "acceptedWindowAndEvent": allowed,
              "event": event, "cron": cron,
              "runId": os.environ["CANARY_RUN_ID"],
              "runAttempt": os.environ["CANARY_RUN_ATTEMPT"],
              "headSha": os.environ["CANARY_HEAD_SHA"],
              "ref": ref, "repository": os.environ["CANARY_REPOSITORY"],
              "workflowRef": os.environ["CANARY_WORKFLOW_REF"],
              "observedUtc": now.isoformat(),
              "windowStartUtc": window_start.isoformat(),
              "windowEndUtcExclusive": window_end.isoformat(),
              "scheduledSlotsUtc": slots,
              "claim": "event/window diagnostic only; no publication or provider observation"
          }, sort_keys=True))
          raise SystemExit(0 if allowed else 1)
