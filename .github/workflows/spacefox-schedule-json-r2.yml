{
  "name": "SpaceFox temporary paired schedule format diagnostic \u2014 remove after 2026-11-12 13:45 UTC",
  "on": {
    "schedule": [
      {
        "cron": "15 13 12 11 *"
      },
      {
        "cron": "20 13 12 11 *"
      }
    ],
    "workflow_dispatch": {}
  },
  "permissions": {},
  "jobs": {
    "observe": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "steps": [
        {
          "name": "Log trusted event identity within the finite UTC window",
          "shell": "python",
          "env": {
            "CANARY_EVENT": "${{ github.event_name }}",
            "CANARY_CRON": "${{ github.event.schedule }}",
            "CANARY_RUN_ID": "${{ github.run_id }}",
            "CANARY_RUN_ATTEMPT": "${{ github.run_attempt }}",
            "CANARY_HEAD_SHA": "${{ github.sha }}",
            "CANARY_REF": "${{ github.ref }}",
            "CANARY_REPOSITORY": "${{ github.repository }}",
            "CANARY_WORKFLOW_REF": "${{ github.workflow_ref }}",
            "CANARY_FORMAT": "json"
          },
          "run": "from datetime import datetime, timezone\nimport json\nimport os\n\n# Temporary diagnostic only. Cron has no year; reject outside this UTC window.\nwindow_start = datetime.fromisoformat(\"2026-11-12T12:20:00+00:00\")\nwindow_end = datetime.fromisoformat(\"2026-11-12T13:45:00+00:00\")\nslots = {\"15 13 12 11 *\": \"2026-11-12T13:15:00+00:00\",\n         \"20 13 12 11 *\": \"2026-11-12T13:20:00+00:00\"}\nnow = datetime.now(timezone.utc)\nevent = os.environ[\"CANARY_EVENT\"]\ncron = os.environ[\"CANARY_CRON\"]\nref = os.environ[\"CANARY_REF\"]\nallowed = (window_start <= now < window_end and ref == \"refs/heads/main\" and\n           ((event == \"workflow_dispatch\" and cron == \"\") or\n            (event == \"schedule\" and cron in slots and\n             now >= datetime.fromisoformat(slots[cron]))))\nprint(json.dumps({\n    \"diagnostic\": \"spacefox-schedule-format-pair-r2\",\n    \"format\": os.environ[\"CANARY_FORMAT\"],\n    \"acceptedWindowAndEvent\": allowed,\n    \"event\": event, \"cron\": cron,\n    \"runId\": os.environ[\"CANARY_RUN_ID\"],\n    \"runAttempt\": os.environ[\"CANARY_RUN_ATTEMPT\"],\n    \"headSha\": os.environ[\"CANARY_HEAD_SHA\"],\n    \"ref\": ref, \"repository\": os.environ[\"CANARY_REPOSITORY\"],\n    \"workflowRef\": os.environ[\"CANARY_WORKFLOW_REF\"],\n    \"observedUtc\": now.isoformat(),\n    \"windowStartUtc\": window_start.isoformat(),\n    \"windowEndUtcExclusive\": window_end.isoformat(),\n    \"scheduledSlotsUtc\": slots,\n    \"claim\": \"event/window diagnostic only; no publication or provider observation\"\n}, sort_keys=True))\nraise SystemExit(0 if allowed else 1)\n"
        }
      ]
    }
  }
}
