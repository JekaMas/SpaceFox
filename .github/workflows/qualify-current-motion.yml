name: Qualify current motion producer on Linux

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  current-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned renderer
        run: bash .github/scripts/install-native-linux-renderer.sh
      - name: Exercise current producer and durable publication locally
        run: python3 -B -m unittest -v tests.test_current_motion_publisher tests.test_current_metadata_publisher
