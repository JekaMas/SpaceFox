name: SpaceFox offline Linux motion qualification

on:
  push:
    branches: [qualification/native-linux-motion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/native-linux-motion-lock.json
      - name: Materialize exact reviewed source and references
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY' | git sparse-checkout set --no-cone --stdin
          import json
          from pathlib import Path
          lock = json.loads(Path('.github/native-linux-motion-lock.json').read_text())
          paths = set(lock['sourceFiles']) | {'.github/native-linux-motion-lock.json'}
          for reference in lock['references'].values():
              paths.update(reference['root'] + '/' + p for p in reference['files'])
          print('\n'.join('/' + p for p in sorted(paths)))
          PY
      - name: Install verified Ubuntu renderer for qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-motion-logs"
          bash .github/scripts/install-native-linux-renderer.sh 2>&1 | tee "$RUNNER_TEMP/native-motion-logs/prerequisites.log"
      - name: Qualify current frozen motion and legacy streams
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN SPACEFOX_SITE
          python3 -B -m unittest -v tests.test_native_linux_motion_qualification 2>&1 | tee "$RUNNER_TEMP/native-motion-logs/tests.log"
          python3 -B -m tools.qualify_native_linux_motion --require-linux --output "$RUNNER_TEMP/native-motion-result" 2>&1 | tee "$RUNNER_TEMP/native-motion-logs/qualification.log"
      - name: Retain bounded qualification and prerequisite diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-linux-motion-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-motion-result
            ${{ runner.temp }}/native-motion-logs
            ${{ runner.temp }}/native-linux-prerequisites
          if-no-files-found: error
          retention-days: 14
