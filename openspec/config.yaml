schema: spec-driven

context: |
  SpaceFox is an independent Garmin Forerunner 165 watch-face project.
  Preserve readable local time, four configurable fitness fields, launch countdown,
  model-specific rocket visuals and a launch-site globe/map. Use distinct compact
  reschedule and stale-data indicators. The repository currently provides a
  specification and illustrative browser prototype, not a completed native app.
  Original SpaceFox specifications, source and translations use MIT.
  Read README.md, openspec/README.md and the selected change before editing.
