name: SpaceFox offline Linux static-native qualification

on:
  # Root publishes only a sanitized source/fixture branch for this run. This is
  # deliberately absent from main's push, schedule and publisher concurrency.
  push:
    branches: [qualification/native-linux-static]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/native-linux-static-lock.json
      - name: Materialize only the reviewed qualification source and fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY' | git sparse-checkout set --no-cone --stdin
          import json
          from pathlib import Path
          lock = json.loads(Path('.github/native-linux-static-lock.json').read_text())
          paths = set(lock['sourceFiles']) | set(lock['qualificationFiles']) | {'.github/native-linux-static-lock.json'}
          for fixture in lock['fixtures'].values():
              paths.update(fixture['inputRoot'] + '/' + name for name in fixture['inputs'])
              paths.update(fixture['referenceRoot'] + '/' + name for name in fixture['referenceFiles'])
          print('\n'.join('/' + path for path in sorted(paths)))
          PY
      - name: Install exact checked Ubuntu renderer for qualification only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-linux-logs"
          bash .github/scripts/install-native-linux-renderer.sh 2>&1 | tee "$RUNNER_TEMP/native-linux-logs/prerequisites.log"
      - name: Exercise actual frozen static flat and globe producer
        shell: bash
        run: |
          set -euo pipefail
          # Operational secrets are neither inputs nor prerequisites of this tool.
          unset GH_TOKEN GITHUB_TOKEN SPACEFOX_SITE
          python3 -B tools/qualify_native_linux.py --profile native-raster-v3 --require-linux --output "$RUNNER_TEMP/native-linux-result" 2>&1 | tee "$RUNNER_TEMP/native-linux-logs/qualification.log"
      - name: Retain exact raw candidate and comparison even when differences refuse
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-linux-static-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-linux-result
            ${{ runner.temp }}/native-linux-logs
            ${{ runner.temp }}/native-linux-prerequisites
          if-no-files-found: error
          retention-days: 14
